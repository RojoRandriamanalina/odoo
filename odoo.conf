[options]
; hôte, utilisateur et mot de passe de la base : variables HOST, USER, PASSWORD de l'image
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo
http_interface = 0.0.0.0
proxy_mode = True
list_db = False
; la base = premier sous-domaine (odoo -> base « odoo », odoo-release -> base « odoo-release »)
dbfilter = ^%d$
workers = 2
limit_time_cpu = 120
limit_time_real = 240
